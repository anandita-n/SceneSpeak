<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SceneSpeak</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- HOME -->
  <section id="view-home" class="view">
    <div class="home-wrap">
      <h1>🗣️ SceneSpeak</h1>
      <p class="subtitle">AAC communication boards, generated from a real photo.</p>
      <div class="home-cards">
        <button type="button" class="home-card" data-nav="create">
          <span class="home-icon">📷</span>
          <span>Create a Board</span>
        </button>
        <button type="button" class="home-card" data-nav="library">
          <span class="home-icon">📚</span>
          <span>My Library</span>
        </button>
      </div>
    </div>
  </section>

  <!-- CREATE -->
  <section id="view-create" class="view" hidden>
    <div class="topbar">
      <button type="button" class="icon-btn" data-nav="home">🏠 Home</button>
      <h2>Create a Board</h2>
    </div>
    <div class="card">
      <form id="board-form">
        <div class="form-row">
          <div class="field">
            <label for="photo">Photo of the scene</label>
            <input type="file" id="photo" name="photo" accept="image/*" required />
            <img id="preview" alt="Preview of the uploaded photo" />
          </div>
          <div class="field">
            <label for="scenario">Activity / context (optional)</label>
            <input type="text" id="scenario" name="scenario" placeholder="e.g. practicing at the playground" />
          </div>
          <div class="field">
            <label for="child_id">Child</label>
            <input type="text" id="child_id" name="child_id" placeholder="e.g. Alex" value="default" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="gemini_api_key">Gemini API key <span class="hint">(saved in this browser only — skip if set in .env)</span></label>
            <input type="password" id="gemini_api_key" name="gemini_api_key" placeholder="AIza..." autocomplete="off" />
          </div>
        </div>
        <button type="submit" id="submit-btn">Create board</button>
        <div class="status" id="status"></div>
      </form>
    </div>
  </section>

  <!-- BOARD -->
  <section id="view-board" class="view" hidden>
    <div class="topbar">
      <button type="button" class="icon-btn" data-nav="home">🏠 Home</button>
      <h2>Board</h2>
      <button type="button" class="icon-btn" id="edit-toggle">✏️ Edit</button>
    </div>
    <div class="board-layout">
      <div class="board-photo-pane">
        <img id="board-photo" alt="The scene this board was generated from" />
        <p id="caption-line"></p>
      </div>
      <div class="board-symbols-pane">
        <div id="categories"></div>
        <div class="rejected" id="rejected" hidden></div>
      </div>
    </div>
  </section>

  <!-- LIBRARY -->
  <section id="view-library" class="view" hidden>
    <div class="topbar">
      <button type="button" class="icon-btn" data-nav="home">🏠 Home</button>
      <h2>My Library</h2>
    </div>
    <div id="library-grid" class="library-grid"></div>
    <p id="library-empty" class="status" hidden>No boards yet — create your first one!</p>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
